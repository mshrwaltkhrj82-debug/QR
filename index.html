<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#070B14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ماسح ومنشئ QR</title>

    <!-- مكتبات قراءة وإنشاء QR -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" onerror="this.onerror=null;this.src='https://unpkg.com/jsqr@1.4.0/dist/jsQR.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/qrcode@1.5.1/build/qrcode.min.js'"></script>

    <!-- خط القاهرة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #070B14;
            --bg-secondary: #0F172A;
            --glass-surface: rgba(15, 23, 42, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #6366F1;
            --primary-glow: rgba(99, 102, 241, 0.45);
            --accent: #00F5D4;
            --accent-glow: rgba(0, 245, 212, 0.35);
            --coral: #F43F5E;
            --emerald: #10B981;
            --amber: #F59E0B;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }

        body {
            background-color: var(--bg-main);
            background-image:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.14) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 245, 212, 0.1) 0px, transparent 50%);
            color: var(--text-primary);
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            touch-action: manipulation;
        }

        /* ==================== الإشعارات ==================== */
        #toastBox {
            position: fixed;
            top: calc(14px + var(--safe-top));
            left: 16px;
            right: 16px;
            margin: 0 auto;
            width: fit-content;
            max-width: calc(100vw - 32px);
            transform: translateY(-130px);
            background: rgba(15, 23, 42, 0.96);
            border: 1.5px solid var(--accent);
            color: var(--text-primary);
            padding: 9px 18px;
            border-radius: 999px;
            font-size: 0.84rem;
            font-weight: 700;
            z-index: 9999;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #toastBox.show {
            transform: translateY(0);
        }

        /* ==================== الشريط العلوي ==================== */
        .app-header {
            width: 100%;
            height: calc(56px + var(--safe-top));
            padding: var(--safe-top) 16px 0;
            background: rgba(7, 11, 20, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
            flex-shrink: 0;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.08rem;
            font-weight: 800;
            background: linear-gradient(90deg, #FFFFFF, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            min-width: 0;
        }

        .sound-toggle {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            border: 1px solid var(--glass-border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        /* ==================== حاوية الصفحات ==================== */
        .views-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            width: 100%;
            min-height: 0;
        }

        .view-page {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            touch-action: pan-y;
            padding-bottom: calc(92px + var(--safe-bottom));
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .view-page.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            z-index: 5;
        }

        /* ==================== 1. صفحة المسح (كاميرا ملء الشاشة) ==================== */
        #scannerView {
            display: block;
            padding: 0;
            overflow: hidden;
            touch-action: none;
            background: #000;
        }

        .camera-stage {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            background: #000;
        }

        #cameraVideo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            min-width: 100%;
            min-height: 100%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            object-position: center center;
            display: block;
            background: #000;
        }

        #cameraVideo.mirrored {
            transform: translate(-50%, -50%) scaleX(-1);
        }

        .scanner-vignette {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, transparent 36%, rgba(7, 11, 20, 0.58) 88%);
            z-index: 1;
            pointer-events: none;
        }

        .scanner-ui-layer {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px calc(86px + var(--safe-bottom));
            gap: 10px;
        }

        .scan-hud {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .scan-result-box {
            background: var(--glass-surface);
            border: 1.5px solid rgba(0, 245, 212, 0.35);
            border-radius: 18px;
            padding: 11px 14px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-align: center;
            transition: border-color 0.25s ease;
        }

        .scan-type-badge {
            font-size: 0.74rem;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 999px;
            background: rgba(0, 245, 212, 0.14);
            color: var(--accent);
            display: none;
        }

        #resultText {
            font-size: 0.94rem;
            font-weight: 700;
            color: var(--text-primary);
            word-break: break-word;
            overflow-wrap: anywhere;
            max-height: 74px;
            overflow-y: auto;
            -webkit-user-select: text;
            user-select: text;
        }

        .scan-action-row {
            display: none;
            gap: 7px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .hud-btn {
            height: 38px;
            padding: 0 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            font-size: 0.82rem;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
        }

        #openActionBtn { background: var(--primary); display: none; }
        #secondaryActionBtn { background: var(--emerald); display: none; }
        #copyScanBtn { background: var(--bg-secondary); border-color: var(--accent); color: var(--accent); }
        #resetScanBtn { background: rgba(244, 63, 94, 0.85); }

        .scanner-frame-wrap {
            position: relative;
            width: min(60vw, 31dvh, 245px);
            height: min(60vw, 31dvh, 245px);
            min-width: 145px;
            min-height: 145px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            flex-shrink: 1;
        }

        .corner {
            position: absolute;
            width: 36px;
            height: 36px;
            border-color: var(--accent);
            border-style: solid;
            border-width: 0;
            transition: border-color 0.3s ease;
        }
        .corner.tl { top: 0; left: 0; border-top-width: 5px; border-left-width: 5px; border-top-left-radius: 20px; }
        .corner.tr { top: 0; right: 0; border-top-width: 5px; border-right-width: 5px; border-top-right-radius: 20px; }
        .corner.bl { bottom: 0; left: 0; border-bottom-width: 5px; border-left-width: 5px; border-bottom-left-radius: 20px; }
        .corner.br { bottom: 0; right: 0; border-bottom-width: 5px; border-right-width: 5px; border-bottom-right-radius: 20px; }

        .laser-line {
            position: absolute;
            left: 8%;
            width: 84%;
            height: 3px;
            background: var(--accent);
            border-radius: 999px;
            box-shadow: 0 0 14px var(--accent), 0 0 28px var(--accent);
            animation: moveLaser 2.2s infinite ease-in-out;
        }

        @keyframes moveLaser {
            0%, 100% { top: 10%; }
            50% { top: 88%; }
        }

        .cam-dock {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .zoom-row {
            display: none;
            align-items: center;
            gap: 10px;
            background: var(--glass-surface);
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid var(--glass-border);
        }

        .zoom-row span {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--accent);
            min-width: 38px;
        }

        #zoomSlider {
            flex: 1;
            accent-color: var(--accent);
            height: 5px;
        }

        .cam-buttons-bar {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .dock-btn {
            flex: 1;
            min-width: 0;
            height: 44px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: var(--glass-surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--text-primary);
            font-size: 0.84rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            white-space: nowrap;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
        }

        .dock-btn.highlight {
            border-color: rgba(0, 245, 212, 0.45);
            color: var(--accent);
        }

        .dock-btn.active-torch {
            border-color: var(--amber);
            color: var(--amber);
        }

        /* ==================== 2. صفحة الإنشاء ==================== */
        #generatorView {
            padding: 14px 12px calc(96px + var(--safe-bottom));
        }

        .studio-grid {
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 14px;
        }

        @media (min-width: 820px) {
            .studio-grid {
                grid-template-columns: minmax(0, 340px) minmax(0, 1fr);
                align-items: start;
            }
        }

        .preview-panel {
            min-width: 0;
            width: 100%;
            background: var(--glass-surface);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
        }

        .canvas-container {
            width: min(54vw, 210px);
            height: min(54vw, 210px);
            background: #FFFFFF;
            border-radius: 16px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
            position: relative;
            overflow: hidden;
            transition: background-color 0.2s ease;
        }

        #qrCanvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 10px;
            display: none;
        }

        #qrPlaceholder {
            color: #475569;
            font-size: 0.83rem;
            font-weight: 700;
            text-align: center;
            padding: 10px;
            line-height: 1.5;
        }

        #genStatusText {
            margin-top: 10px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-align: center;
            min-height: 22px;
            width: 100%;
            word-break: break-word;
        }

        .export-bar {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 7px;
            width: 100%;
            margin-top: 10px;
        }

        .exp-btn {
            min-width: 0;
            width: 100%;
            height: 40px;
            border-radius: 11px;
            border: none;
            font-size: 0.8rem;
            font-weight: 800;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 6px;
        }

        .btn-png { background: var(--emerald); }
        .btn-jpg { background: var(--coral); }
        .btn-share { background: var(--primary); }

        .controls-panel {
            min-width: 0;
            width: 100%;
            background: var(--glass-surface);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
        }

        .section-label {
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .template-tabs {
            display: flex;
            gap: 6px;
            width: 100%;
            overflow-x: auto;
            touch-action: pan-x;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .template-tabs::-webkit-scrollbar { display: none; }

        .tpl-tab {
            padding: 7px 11px;
            border-radius: 11px;
            border: 1px solid var(--glass-border);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .tpl-tab.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .tpl-form {
            display: none;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .tpl-form.active {
            display: flex;
        }

        .field-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 8px;
        }

        @media (max-width: 420px) {
            .field-row {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        .std-input, .std-select, .std-textarea {
            width: 100%;
            min-width: 0;
            height: 44px;
            background: var(--bg-main);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 0 12px;
            color: var(--text-primary);
            font-size: 0.88rem;
            font-weight: 600;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
            transition: border-color 0.2s ease, opacity 0.2s ease;
        }

        .std-input:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .std-select option {
            background-color: var(--bg-main);
            color: var(--text-primary);
        }

        .std-textarea {
            height: 74px;
            padding: 10px 12px;
            resize: none;
        }

        .std-input:focus, .std-select:focus, .std-textarea:focus {
            border-color: var(--accent);
        }

        .upload-zone {
            width: 100%;
            border: 2px dashed rgba(99, 102, 241, 0.55);
            background: rgba(99, 102, 241, 0.07);
            border-radius: 15px;
            padding: 15px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: var(--accent);
            background: rgba(0, 245, 212, 0.08);
        }

        .upload-zone.disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        .upload-zone h4 {
            font-size: 0.92rem;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .upload-zone p {
            font-size: 0.76rem;
            color: var(--text-secondary);
            line-height: 1.45;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: width 0.25s ease;
        }

        .style-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            background: var(--bg-main);
            padding: 10px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
        }

        .color-item {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.72rem;
            color: var(--text-secondary);
            font-weight: 700;
        }

        .color-item input[type="color"] {
            width: 100%;
            height: 36px;
            border: 1px solid var(--glass-border);
            border-radius: 9px;
            background: transparent;
            cursor: pointer;
            padding: 2px;
        }

        .logo-btn {
            width: 100%;
            height: 36px;
            border-radius: 9px;
            border: 1px dashed var(--accent);
            background: rgba(0, 245, 212, 0.08);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 4px;
        }

        /* ==================== 3. صفحة السجل ==================== */
        #historyView {
            padding: 16px 12px calc(96px + var(--safe-bottom));
        }

        .history-container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
        }

        .clear-hist-btn {
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid rgba(244, 63, 94, 0.4);
            background: rgba(244, 63, 94, 0.12);
            color: var(--coral);
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-card {
            background: var(--glass-surface);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 11px 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .hist-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .hist-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-bottom: 3px;
        }

        .hist-tag {
            padding: 1px 8px;
            border-radius: 999px;
            font-weight: 700;
            background: rgba(99, 102, 241, 0.2);
            color: #C7D2FE;
        }

        .hist-tag.scan {
            background: rgba(0, 245, 212, 0.15);
            color: var(--accent);
        }

        .hist-data {
            font-size: 0.86rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hist-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .mini-btn {
            padding: 6px 10px;
            border-radius: 9px;
            border: 1px solid var(--glass-border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.74rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* ==================== شريط التنقل السفلي ==================== */
        .bottom-nav {
            position: fixed;
            bottom: calc(12px + var(--safe-bottom));
            left: 14px;
            right: 14px;
            margin: 0 auto;
            max-width: 440px;
            height: 58px;
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            display: grid;

        // ==================== القارئ المدمج بالمتصفح ====================
        async function initBarcodeDetector() {
            if (!('BarcodeDetector' in window)) return;
            try {
                if (typeof BarcodeDetector.getSupportedFormats === 'function') {
                    const formats = await BarcodeDetector.getSupportedFormats();
                    if (!formats.includes('qr_code')) return;

                barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
            } catch (_) {

        function extractJsQRText(code) {
            if (!code) return "";
            if (code.data && code.data.trim() !== "") return code.data.trim();
            if (code.binaryData && code.binaryData.length > 0 && typeof TextDecoder !== "undefined") {
                try {
                    return new TextDecoder('utf-8').decode(new Uint8Array(code.binaryData)).trim();
                } catch (_) {}
            }
            return "";
        }

        // ==================== محرك قراءة الـ QR الملون بأي لون ====================
        function runJsQR(rgbaData, w, h) {
            if (typeof jsQR !== "function") return "";
            const code = jsQR(rgbaData, w, h, { inversionAttempts: "attemptBoth" });
            return extractJsQRText(code);
        }

        function buildColorSeparatedRGBA(src, w, h, mode) {
            const len = src.length;
            const pixelCount = w * h;
            const vals = new Float32Array(pixelCount);
            let minV = Infinity;
            let maxV = -Infinity;

            if (mode === "dist") {
                let bgR = 0, bgG = 0, bgB = 0, samples = 0;
                const stepX = Math.max(1, Math.floor(w / 18));
                const stepY = Math.max(1, Math.floor(h / 18));
                for (let x = 0; x < w; x += stepX) {
                    const t = x * 4;
                    const b = ((h - 1) * w + x) * 4;
                    bgR += src[t] + src[b];
                    bgG += src[t + 1] + src[b + 1];
                    bgB += src[t + 2] + src[b + 2];
                    samples += 2;
                }
                for (let y = 0; y < h; y += stepY) {
                    const l = (y * w) * 4;
                    const r = (y * w + (w - 1)) * 4;
                    bgR += src[l] + src[r];
                    bgG += src[l + 1] + src[r + 1];
                    bgB += src[l + 2] + src[r + 2];
                    samples += 2;
                }
                bgR /= samples;
                bgG /= samples;
                bgB /= samples;

                for (let p = 0, i = 0; i < len; i += 4, p++) {
                    const dr = src[i] - bgR;
                    const dg = src[i + 1] - bgG;
                    const db = src[i + 2] - bgB;
                    const d = Math.sqrt(dr * dr + dg * dg + db * db);
                    vals[p] = d;
                    if (d < minV) minV = d;
                    if (d > maxV) maxV = d;
                }
            } else {
                for (let p = 0, i = 0; i < len; i += 4, p++) {
                    const r = src[i];
                    const g = src[i + 1];
                    const b = src[i + 2];
                    let v = 0;
                    if (mode === "r") v = r;
                    else if (mode === "g") v = g;
                    else if (mode === "b") v = b;
                    else if (mode === "sat") v = Math.max(r, g, b) - Math.min(r, g, b);
                    else if (mode === "rg") v = r - g;
                    else if (mode === "rb") v = r - b;
                    else if (mode === "gb") v = g - b;
                    else v = 0.299 * r + 0.587 * g + 0.114 * b;

                    vals[p] = v;
                    if (v < minV) minV = v;
                    if (v > maxV) maxV = v;
                }
            }

            const range = maxV - minV;
            if (range < 8) return null;

            const out = new Uint8ClampedArray(len);
            const scale = 255 / range;
            const invert = (mode === "dist" || mode === "sat");

            for (let p = 0, i = 0; i < len; i += 4, p++) {
                let gray = Math.round((vals[p] - minV) * scale);
                if (invert) gray = 255 - gray;
                out[i] = gray;
                out[i + 1] = gray;
                out[i + 2] = gray;
                out[i + 3] = 255;
            }
            return out;
        }

        function decodeAnyColorImageData(imgData, tryAllModes = false, specificMode = null) {
            const { data, width, height } = imgData;

            if (!specificMode) {
                const rawRes = runJsQR(data, width, height);
                if (rawRes) return rawRes;
            }

            const modes = specificMode
                ? [specificMode]
                : (tryAllModes ? ["sat", "b", "r", "g", "dist", "rg", "rb", "gb", "luma"] : []);

            for (const m of modes) {
                const separated = buildColorSeparatedRGBA(data, width, height, m);
                if (separated) {
                    const res = runJsQR(separated, width, height);
                    if (res) return res;
                }
            }
            return "";
        }

        // ==================== دوال مساعدة ====================

        async function copyTextSafe(text) {
            if (!text) return false;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (_) {}

            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (_) {
                return false;
            }
        }

        function drawRoundRect(ctx, x, y, w, h, r) {
            const radius = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + w, y, x + w, y + h, radius);
            ctx.arcTo(x + w, y + h, x, y + h, radius);
            ctx.arcTo(x, y + h, x, y, radius);
            ctx.arcTo(x, y, x + w, y, radius);
            ctx.closePath();
        }

        function escapeWifiValue(str) {
            return str.replace(/([\\;,:"])/g, '\\$1');
        }

        function unescapeWifiValue(str) {
            return str.replace(/\\([\\;,:"])/g, '$1');
        }

        function escapeXml(str) {
            return String(str || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&apos;");
        }

        function makeUUID() {
            if (window.crypto && typeof window.crypto.randomUUID === "function") {
                return window.crypto.randomUUID().toUpperCase();
            }
            return "XXXXXXXX-XXXX-4XXX-YXXX-XXXXXXXXXXXX".replace(/[XY]/g, (c) => {
                const r = Math.random() * 16 | 0;
                const v = c === "X" ? r : (r & 0x3 | 0x8);
                return v.toString(16).toUpperCase();
            });
        }

        async function fetchWithTimeout(url, options = {}, timeoutMs = 25000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                return await fetch(url, { ...options, signal: controller.signal });
            } finally {
                clearTimeout(timer);
            }
        }

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const res = reader.result || "";
                    const idx = res.indexOf(',');
                    resolve(idx >= 0 ? res.slice(idx + 1) : res);
                };
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        // ==================== إجراءات الواي فاي وجهات الاتصال ====================
        async function connectToWifiNetwork(wifiInfo) {
            const { ssid, pass, enc, hidden } = wifiInfo;
            if (pass) {
                await copyTextSafe(pass);
            }

            if (IS_IOS) {
                // في أنظمة Apple قيمة WPA2 تدعم شبكات WPA2 و WPA2/WPA3 تلقائياً، وقيمة WPA3 لشبكات WPA3 فقط
                const encType = enc === "WEP"
                    ? "WEP"
                    : (enc === "nopass" || !pass)
                        ? "None"
                        : (enc === "WPA3" ? "WPA3" : "WPA2");

                const payloadUUID = makeUUID();
                const rootUUID = makeUUID();
                const passBlock = encType !== "None"
                    ? `\n            <key>Password</key>\n            <string>${escapeXml(pass)}</string>`
                    : "";

                const profileXml = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>PayloadContent</key>
    <array>
        <dict>
            <key>AutoJoin</key>
            <true/>
            <key>EncryptionType</key>
            <string>${encType}</string>
            <key>HIDDEN_NETWORK</key>
            <${hidden ? "true" : "false"}/>
            <key>PayloadDisplayName</key>
            <string>${escapeXml(ssid)}</string>
            <key>PayloadIdentifier</key>
            <string>com.qr.wifi.${payloadUUID}</string>
            <key>PayloadType</key>
            <string>com.apple.wifi.managed</string>
            <key>PayloadUUID</key>
            <string>${payloadUUID}</string>
            <key>PayloadVersion</key>
            <integer>1</integer>
            <key>SSID_STR</key>
            <string>${escapeXml(ssid)}</string>${passBlock}
        </dict>
    </array>
    <key>PayloadDisplayName</key>
    <string>Wi-Fi: ${escapeXml(ssid)}</string>
    <key>PayloadIdentifier</key>
    <string>com.qr.profile.${rootUUID}</string>
    <key>PayloadType</key>
    <string>Configuration</string>
    <key>PayloadUUID</key>
    <string>${rootUUID}</string>
    <key>PayloadVersion</key>
    <integer>1</integer>
</dict>
</plist>`;

                const blob = new Blob([profileXml], { type: "application/x-apple-aspen-config" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 10000);

                showToast(pass ? "تم نسخ الرمز • وافق على ملف الشبكة للاتصال" : "وافق على ملف الشبكة للاتصال");
                return;
            }

            if (IS_ANDROID) {
                showToast(pass ? "تم نسخ الرمز • اختر الشبكة من الإعدادات" : "اختر الشبكة من إعدادات الواي فاي");
                setTimeout(() => {
                    window.location.href = "intent:#Intent;action=android.settings.WIFI_SETTINGS;end;";
                }, 250);
                return;
            }

            showToast(pass ? "تم نسخ كلمة المرور ✓" : `اسم الشبكة: ${ssid}`);
        }

        function saveContactToDevice(vcardText, contactName) {
            const normalized = vcardText.replace(/\r?\n/g, "\r\n");
            const blob = new Blob([normalized], { type: "text/vcard;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;

            if (!IS_IOS) {
                const safeName = (contactName || "contact").replace(/[\\/:*?"<>|]/g, "_");
                a.download = `${safeName}.vcf`;
            }

            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 10000);
            showToast("تم فتح بطاقة جهة الاتصال للحفظ ✓");
        }

        function mecardToVcard(raw) {
            const body = raw.replace(/^MECARD:/i, '');
            const getField = (key) => {
                const m = body.match(new RegExp(`(?:^|;)${key}:([^;]*)`, 'i'));
                return m ? m[1].trim() : "";
            };
            const name = getField("N").replace(/,/g, " ").trim();
            const phone = getField("TEL");
            const email = getField("EMAIL");
            const org = getField("ORG");

            const lines = ["BEGIN:VCARD", "VERSION:3.0"];
            if (name) {
                lines.push(`N:;${name};;;`);
                lines.push(`FN:${name}`);
            }
            if (phone) lines.push(`TEL;TYPE=CELL:${phone}`);
            if (email) lines.push(`EMAIL;TYPE=INTERNET:${email}`);
            if (org) lines.push(`ORG:${org}`);
            lines.push("END:VCARD");
            return { name: name || "جهة اتصال", phone, vcard: lines.join("\r\n") };
        }

        // ==================== الصوت ====================
        soundToggleBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundToggleBtn.textContent = soundEnabled ? "🔊" : "🔇";
            showToast(soundEnabled ? "تم تشغيل الصوت" : "تم كتم الصوت");
        });

        function playBeep() {
            if (!soundEnabled) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(920, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1380, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.11);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.11);
            } catch (_) {}
        }

        // ==================== التنقل بين الصفحات ====================

        // ==================== الكاميرا والمسح ====================
        function stopCamera() {
            cameraRequestId++;
            if (scanLoopId) {
                cancelAnimationFrame(scanLoopId);
                scanLoopId = null;
            }
            if (videoStream) {
                videoStream.getTracks().forEach(t => t.stop());
                videoStream = null;
            }
            cameraVideo.srcObject = null;
            isTorchOn = false;
            isDetectingNative = false;
            torchBtn.classList.remove('active-torch');
            torchBtn.style.display = "none";
            zoomRow.style.display = "none";
        }

        async function startCamera() {
            stopCamera();
            const reqId = ++cameraRequestId;
            lastScanCheck = 0;

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                resultText.textContent = "الكاميرا لا تعمل هنا، اختر صورة من المعرض";
                return;
            }

            if (!barcodeDetector && typeof jsQR !== "function") {
                resultText.textContent = "تأكد من الإنترنت وأعد فتح الصفحة";
            }

            const isPortrait = window.innerHeight >= window.innerWidth;
            const tries = [
                {
                    video: {
                        facingMode: { ideal: facingMode },
                        width: { ideal: isPortrait ? 1080 : 1920 },
                        height: { ideal: isPortrait ? 1920 : 1080 }
                    },
                    audio: false
                },
                { video: { facingMode: { ideal: facingMode } }, audio: false },
                { video: true, audio: false }
            ];

            let stream = null;
            for (const c of tries) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia(c);
                    break;
                } catch (_) {}
            }

            if (reqId !== cameraRequestId || activeView !== "scannerView") {
                if (stream) stream.getTracks().forEach(t => t.stop());
                return;
            }

            if (!stream) {
                resultText.textContent = "تعذر تشغيل الكاميرا، تأكد من السماح بالوصول أو اختر صورة";
                return;
            }

            videoStream = stream;
            cameraVideo.muted = true;
            cameraVideo.playsInline = true;
            cameraVideo.setAttribute('playsinline', '');
            cameraVideo.setAttribute('webkit-playsinline', '');
            cameraVideo.classList.toggle('mirrored', facingMode === "user");
            cameraVideo.srcObject = videoStream;
            try { await cameraVideo.play(); } catch (_) {}

            if (reqId !== cameraRequestId || activeView !== "scannerView") {
                stopCamera();
                return;
            }

            const track = videoStream.getVideoTracks()[0];
            if (track && typeof track.getCapabilities === "function") {
                try {
                    const caps = track.getCapabilities();
                    if (caps.focusMode && caps.focusMode.includes('continuous')) {
                        track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
                    }
                    if (caps.torch) {
                        torchBtn.style.display = "flex";
                    }
                    if (caps.zoom && caps.zoom.max > caps.zoom.min) {
                        const minZ = caps.zoom.min || 1;
                        const maxZ = Math.min(caps.zoom.max || 5, 6);
                        const settings = typeof track.getSettings === "function" ? track.getSettings() : {};
                        const curZ = Math.min(maxZ, Math.max(minZ, settings.zoom || minZ));

                        zoomSlider.min = minZ;
                        zoomSlider.max = maxZ;
                        zoomSlider.step = caps.zoom.step || 0.1;
                        zoomSlider.value = curZ;
                        zoomVal.textContent = Number(curZ).toFixed(1) + "x";
                        zoomRow.style.display = "flex";
                    }
                } catch (_) {}
            }

            scanLoopId = requestAnimationFrame(scanFrameLoop);
        }

        zoomSlider.addEventListener('input', async () => {
            if (!videoStream) return;
            const track = videoStream.getVideoTracks()[0];
            if (!track) return;
            const z = parseFloat(zoomSlider.value);
            zoomVal.textContent = z.toFixed(1) + "x";
            try {
                await track.applyConstraints({ advanced: [{ zoom: z }] });
            } catch (_) {}
        });

        switchCamBtn.addEventListener('click', () => {
            facingMode = facingMode === "environment" ? "user" : "environment";
            startCamera();
        });

        torchBtn.addEventListener('click', async () => {
            if (!videoStream) return;
            const track = videoStream.getVideoTracks()[0];
            if (!track) return;
            const nextState = !isTorchOn;
            try {
                await track.applyConstraints({ advanced: [{ torch: nextState }] });
                isTorchOn = nextState;
                torchBtn.classList.toggle('active-torch', isTorchOn);
            } catch (_) {
                showToast("الفلاش غير متوفر");
            }
        });

        function captureVideoRegion(sx, sy, sw, sh, outW, outH) {
            hiddenCanvas.width = outW;
            hiddenCanvas.height = outH;
            hiddenCtx.drawImage(cameraVideo, sx, sy, sw, sh, 0, 0, outW, outH);
            return hiddenCtx.getImageData(0, 0, outW, outH);
        }

        const LIVE_COLOR_MODES = [null, null, "sat", "b", "r", "g", "dist"];

        function scanFrameLoop(ts) {
            if (activeView !== "scannerView" || !videoStream) return;

            const ready = cameraVideo.readyState >= 2 && cameraVideo.videoWidth > 0 && cameraVideo.videoHeight > 0;

            if (ready && ts - lastScanCheck >= 105) {
                lastScanCheck = ts;
                const phase = scanTick % LIVE_COLOR_MODES.length;
                scanTick++;

                if (barcodeDetector && !isDetectingNative) {
                    isDetectingNative = true;
                    barcodeDetector.detect(cameraVideo)
                        .then(codes => {
                            if (activeView === "scannerView" && codes && codes.length > 0) {
                                const val = (codes[0].rawValue || "").trim();
                                if (val) handleDetectedQR(val);
                            }
                        })
                        .catch(() => {})
                        .finally(() => { isDetectingNative = false; });
                }

                if (typeof jsQR === "function") {
                    const vw = cameraVideo.videoWidth;
                    const vh = cameraVideo.videoHeight;
                    let foundText = "";

                    try {
                        if (phase === 0) {
                            const scale = Math.min(1, 780 / Math.max(vw, vh));
                            const outW = Math.max(1, Math.round(vw * scale));
                            const outH = Math.max(1, Math.round(vh * scale));
                            const imgData = captureVideoRegion(0, 0, vw, vh, outW, outH);
                            foundText = decodeAnyColorImageData(imgData, false, null);
                        } else {
                            const cropSide = Math.round(Math.min(vw, vh) * 0.76);
                            const sx = Math.round((vw - cropSide) / 2);
                            const sy = Math.round((vh - cropSide) / 2);
                            const colorMode = LIVE_COLOR_MODES[phase];
                            const maxSide = colorMode ? 440 : 660;
                            const outSide = Math.min(maxSide, cropSide);
                            const imgData = captureVideoRegion(sx, sy, cropSide, cropSide, outSide, outSide);
                            foundText = decodeAnyColorImageData(imgData, false, colorMode);
                        }
                    } catch (_) {}

                    if (foundText) {
                        handleDetectedQR(foundText);
                    }
                }
            }

            scanLoopId = requestAnimationFrame(scanFrameLoop);
        }

        function parseScannedPayload(raw) {
            const lower = raw.toLowerCase();

            if (lower.startsWith("http://") || lower.startsWith("https://")) {
                return {
                    type: "رابط",
                    display: raw,
                    copyValue: raw,
                    copyLabel: "نسخ",
                    primaryText: "فتح ↗",
                    primaryAction: () => window.open(raw, "_blank", "noopener,noreferrer"),
                    secondaryText: "",
                    secondaryHref: ""
                };
            }

            if (/^www\.[^\s]+\.[^\s]+/i.test(raw)) {
                const fullUrl = "https://" + raw;
                return {
                    type: "رابط",
                    display: raw,
                    copyValue: raw,
                    copyLabel: "نسخ",
                    primaryText: "فتح ↗",
                    primaryAction: () => window.open(fullUrl, "_blank", "noopener,noreferrer"),
                    secondaryText: "",
                    secondaryHref: ""
                };
            }

            if (lower.startsWith("mailto:") || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(raw)) {
                const cleanEmail = raw.replace(/^mailto:/i, '').split('?')[0];
                const href = lower.startsWith("mailto:") ? raw : "mailto:" + cleanEmail;
                return {
                    type: "بريد",
                    display: cleanEmail,
                    copyValue: cleanEmail,
                    copyLabel: "نسخ",
                    primaryText: "مراسلة ✉️",
                    primaryAction: () => { window.location.href = href; },
                    secondaryText: "",
                    secondaryHref: ""
                };
            }

            if (lower.startsWith("tel:") || /^\+?[0-9\s\-]{7,16}$/.test(raw)) {
                const cleanTel = raw.replace(/^tel:/i, '').trim();
                const href = "tel:" + cleanTel.replace(/\s+/g, '');
                return {
                    type: "رقم هاتف",
                    display: cleanTel,
                    copyValue: cleanTel,
                    copyLabel: "نسخ",
                    primaryText: "اتصال 📞",
                    primaryAction: () => { window.location.href = href; },
                    secondaryText: "",
                    secondaryHref: ""
                };
            }

            if (lower.startsWith("wifi:")) {
                const ssidMatch = raw.match(/(?:^|[^\\]);?S:((?:\\.|[^;])*)/i);
                const passMatch = raw.match(/(?:^|[^\\]);P:((?:\\.|[^;])*)/i);
                const typeMatch = raw.match(/(?:^|[^\\]);?T:((?:\\.|[^;])*)/i);
                const hiddenMatch = raw.match(/(?:^|[^\\]);H:(true|false)/i);
                const rMatch = raw.match(/(?:^|[^\\]);R:([0-9]+)/i);

                const ssid = ssidMatch && ssidMatch[1] ? unescapeWifiValue(ssidMatch[1]) : "";
                const pass = passMatch && passMatch[1] ? unescapeWifiValue(passMatch[1]) : "";
                const rawType = typeMatch && typeMatch[1] ? typeMatch[1].toUpperCase() : (pass ? "WPA" : "NOPASS");
                const isWpa3Only = rawType === "WPA3" || rawType === "SAE" || (rMatch && rMatch[1] === "1");
                const enc = isWpa3Only
                    ? "WPA3"
                    : (rawType === "WEP" ? "WEP" : ((rawType === "NOPASS" || !pass) ? "nopass" : "WPA2/WPA3"));
                const hidden = hiddenMatch ? hiddenMatch[1].toLowerCase() === "true" : false;

                return {
                    type: enc === "WPA3" ? "واي فاي (WPA3)" : (enc === "WPA2/WPA3" ? "واي فاي (WPA2/WPA3)" : "واي فاي"),
                    display: `الشبكة: ${ssid || "غير معروف"} | الرمز: ${pass || "بدون كلمة مرور"}`,
                    copyValue: pass || ssid,
                    copyLabel: pass ? "نسخ الرمز" : "نسخ الاسم",
                    primaryText: ssid ? "اتصال بالشبكة 📶" : "",
                    primaryAction: ssid ? () => connectToWifiNetwork({ ssid, pass, enc, hidden }) : null,
                    secondaryText: "",
                    secondaryHref: ""
                };
            }

            if (lower.startsWith("begin:vcard")) {
                const fnMatch = raw.match(/FN(?:;[^:]*)?:(.+)/i);
                const telMatch = raw.match(/TEL[^:]*:(.+)/i);
                const name = fnMatch ? fnMatch[1].trim() : "جهة اتصال";
                const phone = telMatch ? telMatch[1].trim() : "";

                return {
                    type: "جهة اتصال",
                    display: `${name}${phone ? ' - ' + phone : ''}`,
                    copyValue: phone || name,
                    copyLabel: phone ? "نسخ الرقم" : "نسخ",
                    primaryText: "إضافة لجهات الاتصال 👤",
                    primaryAction: () => saveContactToDevice(raw, name),
                    secondaryText: phone ? "اتصال 📞" : "",
                    secondaryHref: phone ? `tel:${phone.replace(/\s+/g, '')}` : ""
                };
            }

            if (lower.startsWith("mecard:")) {
                const converted = mecardToVcard(raw);
                return {
                    type: "جهة اتصال",
                    display: `${converted.name}${converted.phone ? ' - ' + converted.phone : ''}`,
                    copyValue: converted.phone || converted.name,
                    copyLabel: converted.phone ? "نسخ الرقم" : "نسخ",
                    primaryText: "إضافة لجهات الاتصال 👤",
                    primaryAction: () => saveContactToDevice(converted.vcard, converted.name),
                    secondaryText: converted.phone ? "اتصال 📞" : "",
                    secondaryHref: converted.phone ? `tel:${converted.phone.replace(/\s+/g, '')}` : ""
                };
            }

            return {
                type: "نص",
                display: raw,
                copyValue: raw,
                copyLabel: "نسخ",
                primaryText: "",
                primaryAction: null,
                secondaryText: "",
                secondaryHref: ""
            };
        }

        function handleDetectedQR(data) {
            if (!data || data === lastScannedData) return;
            lastScannedData = data;

            if (navigator.vibrate) navigator.vibrate(90);
            playBeep();

            corners.forEach(c => c.style.borderColor = "#10B981");
            scanResultBox.style.borderColor = "#10B981";
            setTimeout(() => {
                corners.forEach(c => c.style.borderColor = "#00F5D4");
                scanResultBox.style.borderColor = "rgba(0, 245, 212, 0.35)";
            }, 600);

            const parsed = parseScannedPayload(data);
            scanTypeBadge.textContent = parsed.type;
            scanTypeBadge.style.display = "inline-block";
            resultText.textContent = parsed.display;
            scanActionRow.style.display = "flex";

            currentCopyText = parsed.copyValue || parsed.display;
            copyScanBtn.textContent = parsed.copyLabel || "نسخ";

            if (parsed.primaryAction && parsed.primaryText) {
                currentScanAction = parsed.primaryAction;
                openActionBtn.textContent = parsed.primaryText;
                openActionBtn.style.display = "inline-flex";
            } else {
                currentScanAction = null;
                openActionBtn.style.display = "none";
            }

            if (parsed.secondaryHref && parsed.secondaryText) {
                currentSecondaryHref = parsed.secondaryHref;
                secondaryActionBtn.textContent = parsed.secondaryText;
                secondaryActionBtn.style.display = "inline-flex";
            } else {
                currentSecondaryHref = "";
                secondaryActionBtn.style.display = "none";
            }

            saveToHistory("مسح", parsed.type, parsed.display, data);
        }

        openActionBtn.addEventListener('click', () => {

            }
        });

        secondaryActionBtn.addEventListener('click', () => {

        });

        copyScanBtn.addEventListener('click', async () => {

            const ok = await copyTextSafe(currentCopyText || resultText.textContent);
            showToast(ok ? "تم النسخ ✓" : "تعذر النسخ");
        });

        resetScanBtn.addEventListener('click', () => {
            lastScannedData = "";
            currentScanAction = null;
            currentSecondaryHref = "";
            currentCopyText = "";
            scanTypeBadge.style.display = "none";
            resultText.textContent = "وجّه الكاميرا نحو رمز QR";
            scanActionRow.style.display = "none";
        });

        scanGalleryBtn.addEventListener('click', () => scanFileInput.click());

        scanFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!barcodeDetector && typeof jsQR !== "function") {
                showToast("تأكد من اتصال الإنترنت");
                scanFileInput.value = "";
                return;
            }

            const img = new Image();
            const objUrl = URL.createObjectURL(file);

            img.onload = async () => {
                let found = "";

                if (barcodeDetector) {
                    try {
                        const codes = await barcodeDetector.detect(img);
                        if (codes && codes.length > 0 && codes[0].rawValue) {
                            found = codes[0].rawValue.trim();
                        }
                    } catch (_) {}
                }

                if (!found && typeof jsQR === "function") {
                    const scales = [1000, 650, 1400, 450];
                    for (const maxDim of scales) {
                        let w = img.width;
                        let h = img.height;
                        if (w > maxDim || h > maxDim) {
                            const r = w / h;
                            if (w > h) { w = maxDim; h = Math.round(maxDim / r); }
                            else { h = maxDim; w = Math.round(maxDim * r); }
                        }
                        const pad = 24;
                        hiddenCanvas.width = w + pad * 2;
                        hiddenCanvas.height = h + pad * 2;
                        hiddenCtx.fillStyle = "#FFFFFF";
                        hiddenCtx.fillRect(0, 0, hiddenCanvas.width, hiddenCanvas.height);
                        hiddenCtx.drawImage(img, pad, pad, w, h);

                        const imgData = hiddenCtx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);
                        found = decodeAnyColorImageData(imgData, true, null);
                        if (found) break;
                    }
                }

                URL.revokeObjectURL(objUrl);

                if (found) {
                    lastScannedData = "";
                    handleDetectedQR(found);
                    showToast("تمت القراءة ✓");
                } else {
                    showToast("لم يتم العثور على رمز في الصورة");
                }
            };

            img.onerror = () => {
                URL.revokeObjectURL(objUrl);
                showToast("تعذر فتح الصورة");
            };

            img.src = objUrl;
            scanFileInput.value = "";
        });

        // ==================== إنشاء الرموز ====================
        function syncWifiPassField() {
            const noPass = wifiEncSelect.value === "nopass";
            wifiPassInput.disabled = noPass;
            if (noPass) wifiPassInput.value = "";
        }

        wifiEncSelect.addEventListener('change', () => {
