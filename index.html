        function clearGeneratedQR() {
            qrRenderSeq++;
            currentQRPayload = "";
            hasGeneratedQR = false;
            qrCanvas.style.display = "none";
            qrPlaceholder.style.display = "block";
            genStatusText.style.color = "var(--text-secondary)";
            genStatusText.textContent = "بانتظار الإدخال";
        }

        function buildPayloadFromActiveTemplate() {
            if (currentTemplate === "files") return;

            let payload = "";
            if (currentTemplate === "text") {
                const raw = document.getElementById('inputText').value.trim();
                if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(raw)) payload = "mailto:" + raw;
                else payload = raw;
            } else if (currentTemplate === "wifi") {
                const ssid = document.getElementById('wifiSsid').value.trim();
                const pass = wifiPassInput.value;
                const enc = wifiEncSelect.value;
                if (ssid) {
                    const safeSsid = escapeWifiValue(ssid);
                    const safePass = enc === "nopass" ? "" : escapeWifiValue(pass);
                    if (enc === "nopass") {
                        payload = `WIFI:T:nopass;S:${safeSsid};;`;
                    } else if (enc === "WPA3") {
                        payload = `WIFI:T:WPA;R:1;S:${safeSsid};P:${safePass};;`;
                    } else if (enc === "WEP") {
                        payload = `WIFI:T:WEP;S:${safeSsid};P:${safePass};;`;
                    } else {
                        // WPA2/WPA3 و WPA تستخدمان T:WPA وفق المعيار الرسمي لرموز Wi-Fi QR
                        payload = `WIFI:T:WPA;S:${safeSsid};P:${safePass};;`;
                    }
                }
            } else if (currentTemplate === "whatsapp") {
                const phone = document.getElementById('waPhone').value.replace(/[^0-9]/g, '').replace(/^00/, '');
                const msg = encodeURIComponent(document.getElementById('waMsg').value.trim());
                if (phone) payload = `https://wa.me/${phone}${msg ? '?text=' + msg : ''}`;
            } else if (currentTemplate === "email") {
                const to = document.getElementById('mailTo').value.trim();
                const sub = document.getElementById('mailSub').value.trim();
                const body = document.getElementById('mailBody').value.trim();
                if (to) {
                    const params = [];
                    if (sub) params.push("subject=" + encodeURIComponent(sub));
                    if (body) params.push("body=" + encodeURIComponent(body));
                    payload = `mailto:${to}${params.length ? '?' + params.join('&') : ''}`;
                }
            } else if (currentTemplate === "vcard") {
                const name = document.getElementById('vcName').value.trim();
                const phone = document.getElementById('vcPhone').value.trim();
                const email = document.getElementById('vcEmail').value.trim();
                const org = document.getElementById('vcOrg').value.trim();
                if (name || phone || email || org) {
                    const lines = ["BEGIN:VCARD", "VERSION:3.0"];
                    if (name) {
                        const parts = name.split(/\s+/);
                        const first = parts[0] || "";
                        const last = parts.slice(1).join(" ");
                        lines.push(`N:${last};${first};;;`);
                        lines.push(`FN:${name}`);
                    }
                    if (phone) lines.push(`TEL;TYPE=CELL:${phone}`);
                    if (email) lines.push(`EMAIL;TYPE=INTERNET:${email}`);
                    if (org) lines.push(`ORG:${org}`);
                    lines.push("END:VCARD");
                    payload = lines.join("\r\n");
                }
            }

            if (payload) {
                renderStyledQR(payload);
            } else {
                clearGeneratedQR();
            }
        }

        document.querySelectorAll('.std-input, .std-textarea').forEach(el => {
            el.addEventListener('input', buildPayloadFromActiveTemplate);
        });

        qrDarkColor.addEventListener('input', () => {
            if (currentQRPayload) renderStyledQR(currentQRPayload);
        });

        qrLightColor.addEventListener('input', () => {
            qrCard.style.backgroundColor = qrLightColor.value;
            if (currentQRPayload) renderStyledQR(currentQRPayload);
        });

        pickLogoBtn.addEventListener('click', () => {
            if (customLogoImg) {
                customLogoImg = null;
                if (customLogoUrl) {
                    URL.revokeObjectURL(customLogoUrl);
                    customLogoUrl = null;
                }
                pickLogoBtn.textContent = "+ إضافة شعار";
                if (currentQRPayload) renderStyledQR(currentQRPayload);
                return;
            }
            logoFileInput.click();
        });

        logoFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const img = new Image();
            const objUrl = URL.createObjectURL(file);

            img.onload = () => {
                if (customLogoUrl) URL.revokeObjectURL(customLogoUrl);
                customLogoUrl = objUrl;
                customLogoImg = img;
                pickLogoBtn.textContent = "✕ إزالة الشعار";
                if (currentQRPayload) renderStyledQR(currentQRPayload);
            };
            img.onerror = () => {
                URL.revokeObjectURL(objUrl);
                showToast("تعذر فتح صورة الشعار");
            };
            img.src = objUrl;
            logoFileInput.value = "";
        });

        function renderStyledQR(payload) {
            if (typeof QRCode === "undefined") {
                genStatusText.style.color = "#F43F5E";
                genStatusText.textContent = "تأكد من اتصال الإنترنت";
                return;
            }

            currentQRPayload = payload;
            const seq = ++qrRenderSeq;
            qrCard.style.backgroundColor = qrLightColor.value;

            QRCode.toCanvas(qrCanvas, payload, {
                width: 1024,
                margin: 2,
                errorCorrectionLevel: customLogoImg ? 'H' : 'M',
                color: {
                    dark: qrDarkColor.value,
                    light: qrLightColor.value
                }
            }, (err) => {
                if (seq !== qrRenderSeq) return;

                if (err) {
                    hasGeneratedQR = false;
                    qrCanvas.style.display = "none";
                    qrPlaceholder.style.display = "block";
                    genStatusText.style.color = "#F43F5E";
                    genStatusText.textContent = "النص طويل جداً";
                    return;
                }

                if (customLogoImg) {
                    const ctx = qrCanvas.getContext('2d');
                    const size = 210;
                    const x = (qrCanvas.width - size) / 2;
                    const y = (qrCanvas.height - size) / 2;

                    ctx.fillStyle = qrLightColor.value;
                    drawRoundRect(ctx, x - 14, y - 14, size + 28, size + 28, 28);
                    ctx.fill();

                    ctx.save();
                    drawRoundRect(ctx, x, y, size, size, 20);
                    ctx.clip();

                    const iw = customLogoImg.naturalWidth || customLogoImg.width;
                    const ih = customLogoImg.naturalHeight || customLogoImg.height;
                    const side = Math.min(iw, ih);
                    const sx = (iw - side) / 2;
                    const sy = (ih - side) / 2;
                    ctx.drawImage(customLogoImg, sx, sy, side, side, x, y, size, size);
                    ctx.restore();
                }

                qrPlaceholder.style.display = "none";
                qrCanvas.style.display = "block";
                hasGeneratedQR = true;
                genStatusText.style.color = "#00F5D4";
                genStatusText.textContent = "الرمز جاهز للحفظ والمشاركة ✓";
            });
        }

        // ==================== الحفظ والمشاركة ====================
        function triggerDownload(href, filename, revokeAfter) {
            const a = document.createElement('a');
            a.download = filename;
            a.href = href;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            if (revokeAfter) setTimeout(() => URL.revokeObjectURL(href), 3000);
        }

        function downloadGeneratedQR(asPng) {
            if (!hasGeneratedQR) {
                showToast("أنشئ الرمز أولاً");
                return;
            }
            const ext = asPng ? "png" : "jpg";
            const mime = asPng ? "image/png" : "image/jpeg";
            const filename = `QR_${Date.now()}.${ext}`;

            const finalize = () => {
                saveToHistory("إنشاء", TEMPLATE_LABELS[currentTemplate] || "نص", currentQRPayload, currentQRPayload);
                showToast("تم الحفظ ✓");
            };

            if (typeof qrCanvas.toBlob === "function") {
                qrCanvas.toBlob(blob => {
                    if (blob) {
                        const url = URL.createObjectURL(blob);
                        triggerDownload(url, filename, true);
                    } else {
                        triggerDownload(qrCanvas.toDataURL(mime, 0.96), filename, false);
                    }
                    finalize();
                }, mime, 0.96);
            } else {
                triggerDownload(qrCanvas.toDataURL(mime, 0.96), filename, false);
                finalize();
            }
        }

        savePngBtn.addEventListener('click', () => downloadGeneratedQR(true));
        saveJpgBtn.addEventListener('click', () => downloadGeneratedQR(false));

        shareQrBtn.addEventListener('click', () => {
            if (!hasGeneratedQR) {
                showToast("أنشئ الرمز أولاً");
                return;
            }
            qrCanvas.toBlob(async (blob) => {
                if (!blob) {
                    downloadGeneratedQR(true);
                    return;
                }
                const file = new File([blob], "QR.png", { type: "image/png" });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({ title: "رمز QR", files: [file] });
                        return;
                    } catch (err) {
                        if (err && err.name === "AbortError") return;
                    }
                }
                downloadGeneratedQR(true);
            }, "image/png");
        });

        // ==================== دمج الصور ورفع الملفات ====================
        uploadTriggerZone.addEventListener('click', () => {
            if (!isUploading) uploadFilesInput.click();
        });

        uploadTriggerZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (!isUploading) uploadTriggerZone.classList.add('dragover');
        });

        uploadTriggerZone.addEventListener('dragleave', () => {
            uploadTriggerZone.classList.remove('dragover');
        });

        uploadTriggerZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadTriggerZone.classList.remove('dragover');
            if (!isUploading && e.dataTransfer && e.dataTransfer.files.length) {
                processSelectedUploadFiles(Array.from(e.dataTransfer.files));
            }
        });

        uploadFilesInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            uploadFilesInput.value = "";
            if (files.length) processSelectedUploadFiles(files);
        });

        async function processSelectedUploadFiles(files) {
            if (isUploading) return;

            const pdfFiles = files.filter(f => f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf"));
            const imgFiles = files.filter(f => f.type.startsWith("image/"));

            if (pdfFiles.length === 0 && imgFiles.length === 0) {
                showToast("اختر صور أو ملف PDF فقط");
                return;
            }

            isUploading = true;
            uploadTriggerZone.classList.add('disabled');
            uploadProgressTrack.style.display = "block";
            uploadProgressBar.style.width = "20%";
            genStatusText.style.color = "var(--accent)";

            let uploadedUrl = null;
            let historyLabel = "ملف";

            try {
                if (pdfFiles.length > 0) {
                    historyLabel = "PDF";
                    genStatusText.textContent = "جاري رفع الملف...";
                    uploadProgressBar.style.width = "55%";
                    uploadedUrl = await uploadGeneralFile(pdfFiles[0]);
                } else if (imgFiles.length > 0) {
                    historyLabel = imgFiles.length > 1 ? "صور" : "صورة";
                    genStatusText.textContent = imgFiles.length > 1
                        ? "جاري تجهيز ورفع الصور..."
                        : "جاري رفع الصورة...";
                    const mergedBlob = await combineImagesVertically(imgFiles, 920);
                    uploadProgressBar.style.width = "65%";
                    uploadedUrl = await uploadImageRaw(mergedBlob);
                }
            } catch (_) {}

            uploadProgressBar.style.width = "100%";
            setTimeout(() => {
                uploadProgressTrack.style.display = "none";
                uploadProgressBar.style.width = "0%";
                uploadTriggerZone.classList.remove('disabled');
                isUploading = false;
            }, 400);

            if (uploadedUrl) {
                renderStyledQR(uploadedUrl);
                saveToHistory("إنشاء", historyLabel, uploadedUrl, uploadedUrl);
                showToast("تم إنشاء الرمز ✓");
            } else {
                genStatusText.style.color = "#F43F5E";
                genStatusText.textContent = "فشل الرفع، تأكد من الإنترنت وحاول مرة أخرى";
            }
        }

        function combineImagesVertically(files, baseWidth = 920) {
            return new Promise((resolve, reject) => {
                const loaded = [];
                const objectUrls = [];
                let count = 0;
                let failed = false;

                const cleanup = () => {
                    objectUrls.forEach(u => URL.revokeObjectURL(u));
                };

                files.forEach((file, idx) => {
                    const img = new Image();
                    const objUrl = URL.createObjectURL(file);
                    objectUrls.push(objUrl);

                    img.onload = () => {
                        if (failed) return;
                        loaded[idx] = img;
                        count++;
                        if (count === files.length) {
                            let targetWidth = baseWidth;
                            const gap = loaded.length > 1 ? 300 : 0;
                            let rawHeight = gap * (loaded.length - 1);
                            loaded.forEach(im => rawHeight += Math.round(targetWidth * (im.height / im.width)));

                            if (rawHeight > 3800) {
                                targetWidth = Math.max(360, Math.floor(targetWidth * (3800 / rawHeight)));
                            }

                            const maxPixels = 10000000;
                            let estHeight = gap * (loaded.length - 1);
                            loaded.forEach(im => estHeight += Math.round(targetWidth * (im.height / im.width)));
                            if (targetWidth * estHeight > maxPixels) {
                                const ratio = Math.sqrt(maxPixels / (targetWidth * estHeight));
                                targetWidth = Math.max(320, Math.floor(targetWidth * ratio));
                            }

                            let totalH = 0;
                            const heights = loaded.map(im => {
                                const h = Math.max(1, Math.round(targetWidth * (im.height / im.width)));
                                totalH += h;
                                return h;
                            });
                            totalH += gap * (loaded.length - 1);

                            const c = document.createElement('canvas');
                            c.width = targetWidth;
                            c.height = totalH;
                            const ctx = c.getContext('2d');
                            ctx.fillStyle = "#070B14";
                            ctx.fillRect(0, 0, targetWidth, totalH);

                            let y = 0;
                            loaded.forEach((im, i) => {
                                ctx.drawImage(im, 0, y, targetWidth, heights[i]);
                                y += heights[i] + gap;
                            });

                            cleanup();
                            c.toBlob(b => b ? resolve(b) : reject(new Error("Blob failed")), "image/jpeg", 0.84);
                        }
                    };

                    img.onerror = () => {
                        if (failed) return;
                        failed = true;
                        cleanup();
                        reject(new Error("Image load failed"));
                    };

                    img.src = objUrl;
                });
            });
        }

        function toCloudflareRawImageUrl(rawUrl) {
            const cleanTarget = rawUrl.replace(/^https?:\/\//i, '');
            return `https://wsrv.nl/?url=${encodeURI(cleanTarget)}`;
        }

        async function uploadImageRaw(blob) {
            const imgFile = new File([blob], `qr_${Date.now()}.jpg`, { type: "image/jpeg" });

            try {
                const fdSelf = new FormData();
                fdSelf.append("file", imgFile);
                const rSelf = await fetchWithTimeout("/api/upload", { method: "POST", body: fdSelf }, 15000);
                if (rSelf.ok) {
                    const jSelf = await rSelf.json();
                    if (jSelf && jSelf.url) return jSelf.url;
                }
            } catch (_) {}

            try {
                const b64 = await blobToBase64(blob);
                const body = new URLSearchParams();
                body.append("key", IMGBB_API_KEY);
                body.append("image", b64);

                const res = await fetchWithTimeout("https://api.imgbb.com/1/upload", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: body.toString()
                }, 25000);

                if (res.ok) {
                    const json = await res.json();
                    const rawUrl = json && json.data && (json.data.url || (json.data.image && json.data.image.url));
                    if (rawUrl) {
                        return toCloudflareRawImageUrl(rawUrl);
                    }
                }
            } catch (_) {}

            try {
                const fd2 = new FormData();
                fd2.append("file", imgFile);
                const r2 = await fetchWithTimeout("https://tmpfiles.org/api/v1/upload", { method: "POST", body: fd2 }, 25000);
                if (r2.ok) {
                    const j2 = await r2.json();
                    if (j2 && j2.data && j2.data.url) {
                        let dlUrl = j2.data.url.replace("http://", "https://");
                        if (!dlUrl.includes("tmpfiles.org/dl/")) {
                            dlUrl = dlUrl.replace("tmpfiles.org/", "tmpfiles.org/dl/");
                        }
                        return toCloudflareRawImageUrl(dlUrl);
                    }
                }
            } catch (_) {}

            return await uploadGeneralFile(imgFile);
        }

        async function uploadGeneralFile(file) {
            try {
                const fdSelf = new FormData();
                fdSelf.append("file", file);
                const rSelf = await fetchWithTimeout("/api/upload", { method: "POST", body: fdSelf }, 15000);
                if (rSelf.ok) {
                    const jSelf = await rSelf.json();
                    if (jSelf && jSelf.url) return jSelf.url;
                }
            } catch (_) {}

            try {
                const fd1 = new FormData();
                fd1.append("file", file);
                const r1 = await fetchWithTimeout("https://tmpfiles.org/api/v1/upload", { method: "POST", body: fd1 }, 25000);
                if (r1.ok) {
                    const j1 = await r1.json();
                    if (j1 && j1.data && j1.data.url) {
                        let url = j1.data.url.replace("http://", "https://");
                        if (!url.includes("tmpfiles.org/dl/")) {
                            url = url.replace("tmpfiles.org/", "tmpfiles.org/dl/");
                        }
                        return url;
                    }
                }
            } catch (_) {}

            try {
                const fd2 = new FormData();
                fd2.append("file", file);
                const r2 = await fetchWithTimeout("https://upload.gofile.io/uploadfile", { method: "POST", body: fd2 }, 25000);
                if (r2.ok) {
                    const j2 = await r2.json();
                    if (j2 && j2.status === "ok" && j2.data && j2.data.downloadPage) {
                        return j2.data.downloadPage;
                    }
                }
            } catch (_) {}

            return null;
        }

        // ==================== السجل ====================
        function getHistory() {
            try {
                const parsed = JSON.parse(localStorage.getItem("qr_studio_pro_history") || "[]");
                return Array.isArray(parsed) ? parsed : [];
            } catch (_) {
                return [];
            }
        }

        function saveToHistory(mode, category, display, rawPayload) {
            try {
                const list = getHistory();
                if (list.length > 0 && list[0].rawPayload === rawPayload) return;
                list.unshift({
                    mode,
                    category,
                    display,
                    rawPayload,
                    time: new Date().toLocaleTimeString('ar-IQ', { hour: '2-digit', minute: '2-digit' })
                });
                localStorage.setItem("qr_studio_pro_history", JSON.stringify(list.slice(0, 30)));
            } catch (_) {}
        }

        function renderHistoryList() {
            const list = getHistory();
            historyList.innerHTML = "";

            if (list.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.style.cssText = "text-align:center;color:var(--text-secondary);padding:40px 10px;";
                emptyDiv.textContent = "السجل فارغ";
                historyList.appendChild(emptyDiv);
                return;
            }

            list.forEach((item) => {
                const card = document.createElement('div');
                card.className = "history-card";

                const info = document.createElement('div');
                info.className = "hist-info";

                const meta = document.createElement('div');
                meta.className = "hist-meta";

                const tag = document.createElement('span');
                tag.className = `hist-tag ${item.mode === 'مسح' ? 'scan' : ''}`;
                tag.textContent = `${item.mode} • ${item.category}`;

                const timeSpan = document.createElement('span');
                timeSpan.textContent = item.time || "";

                meta.appendChild(tag);
                meta.appendChild(timeSpan);

                const dataDiv = document.createElement('div');
                dataDiv.className = "hist-data";
                dataDiv.textContent = item.display || item.rawPayload || "";

                info.appendChild(meta);
                info.appendChild(dataDiv);

                const actions = document.createElement('div');
                actions.className = "hist-actions";

                const copyBtn = document.createElement('button');
                copyBtn.className = "mini-btn copy-h";
                copyBtn.textContent = "نسخ";
                copyBtn.addEventListener('click', async () => {
                    const ok = await copyTextSafe(item.rawPayload);
                    showToast(ok ? "تم النسخ ✓" : "تعذر النسخ");
                });

                const regenBtn = document.createElement('button');
                regenBtn.className = "mini-btn regen-h";
                regenBtn.textContent = "عرض QR";
                regenBtn.addEventListener('click', () => {
                    document.querySelector('[data-target="generatorView"]').click();
                    document.querySelector('[data-tpl="text"]').click();
                    document.getElementById('inputText').value = item.rawPayload || "";
                    renderStyledQR(item.rawPayload || "");
                });

                actions.appendChild(copyBtn);
                actions.appendChild(regenBtn);

                card.appendChild(info);
                card.appendChild(actions);
                historyList.appendChild(card);
            });
        }

        clearHistoryBtn.addEventListener('click', () => {
            try {
                localStorage.removeItem("qr_studio_pro_history");
            } catch (_) {}
            renderHistoryList();
            showToast("تم حذف السجل");
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) stopCamera();
            else if (activeView === "scannerView") startCamera();
        });

        window.addEventListener('DOMContentLoaded', () => {
            syncWifiPassField();
            initBarcodeDetector().finally(startCamera);
        });
    </script>
