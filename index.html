<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>استوديو وماسح الـ QR الذكي</title>

    <!-- مكتبات قراءة وتوليد الـ QR -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

    <!-- خط عربي حديث -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #090D16;
            --card-glass: rgba(21, 30, 50, 0.92);
            --input-bg: #0E1422;
            --primary-violet: #6C5CE7;
            --accent-cyan: #00F5D4;
            --action-coral: #FF3B7B;
            --success-mint: #10B981;
            --warning-amber: #F59E0B;
            --text-ice: #F1F5F9;
            --text-muted: #94A3B8;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-ice);
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        /* ==================== شاشة الكاميرا والمسح ==================== */
        #scannerView {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
            padding-top: calc(16px + var(--safe-top));
            padding-bottom: calc(90px + var(--safe-bottom));
            transition: opacity 0.3s ease;
        }

        #cameraVideo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            background: #05080f;
        }

        /* طبقة تعتيم خفيفة حول إطار المسح لزيادة الوضوح */
        .scanner-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 32%, rgba(9, 13, 22, 0.55) 75%);
            z-index: -1;
            pointer-events: none;
        }

        /* بطاقة النتيجة العلوية العائمة */
        .top-hud {
            position: absolute;
            top: calc(18px + var(--safe-top));
            width: min(92%, 520px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 5;
        }

        .result-glass-card {
            width: 100%;
            min-height: 76px;
            max-height: 120px;
            overflow-y: auto;
            background: var(--card-glass);
            border: 2px solid rgba(0, 245, 212, 0.35);
            border-radius: 20px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1rem;
            font-weight: 700;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            word-break: break-all;
            user-select: text;
            transition: border-color 0.25s ease, transform 0.25s ease;
        }

        /* شريط أزرار الإجراءات عند ظهور نتيجة */
        .result-actions {
            display: none;
            width: 100%;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-pill {
            height: 44px;
            padding: 0 18px;
            border-radius: 999px;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            color: var(--text-ice);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        #openUrlBtn { background: var(--primary-violet); display: none; }
        #copyResultBtn { background: var(--card-glass); border-color: var(--accent-cyan); color: var(--accent-cyan); }
        #rescanBtn { background: rgba(255, 59, 123, 0.85); }

        /* إطار التركيز والليزر المتحرك */
        .focus-frame {
            width: min(64vw, 260px);
            height: min(64vw, 260px);
            position: relative;
            border-radius: 26px;
            animation: pulseFrame 2.2s infinite ease-in-out;
            pointer-events: none;
            margin-top: 40px;
        }

        .corner {
            position: absolute;
            width: 44px;
            height: 44px;
            border-color: var(--accent-cyan);
            border-style: solid;
            border-width: 0;
            transition: border-color 0.3s ease;
        }
        .corner.tl { top: 0; left: 0; border-top-width: 5px; border-left-width: 5px; border-top-left-radius: 22px; }
        .corner.tr { top: 0; right: 0; border-top-width: 5px; border-right-width: 5px; border-top-right-radius: 22px; }
        .corner.bl { bottom: 0; left: 0; border-bottom-width: 5px; border-left-width: 5px; border-bottom-left-radius: 22px; }
        .corner.br { bottom: 0; right: 0; border-bottom-width: 5px; border-right-width: 5px; border-bottom-right-radius: 22px; }

        .laser-bar {
            position: absolute;
            left: 8%;
            width: 84%;
            height: 3.5px;
            background: var(--accent-cyan);
            border-radius: 999px;
            box-shadow: 0 0 14px var(--accent-cyan), 0 0 28px var(--accent-cyan);
            animation: scanLaser 2.3s infinite ease-in-out;
        }

        @keyframes pulseFrame {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.025); }
        }

        @keyframes scanLaser {
            0%, 100% { top: 10%; }
            50% { top: 88%; }
        }

        /* أدوات التحكم بالكاميرا والمسح من الجهاز */
        .scanner-controls {
            margin-top: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: min(88%, 380px);
            z-index: 5;
        }

        .camera-tools-row {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .cam-tool-btn {
            flex: 1;
            height: 44px;
            background: var(--card-glass);
            color: var(--text-ice);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
        }

        .cam-tool-btn.active-tool {
            border-color: var(--warning-amber);
            color: var(--warning-amber);
        }

        #scanImageBtn {
            width: 100%;
            height: 52px;
            background: var(--card-glass);
            color: var(--accent-cyan);
            border: 2px solid rgba(0, 245, 212, 0.45);
            border-radius: 999px;
            font-size: 0.96rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.12s ease;
        }

        /* ==================== نافذة استوديو التوليد ==================== */
        #generatorView {
            position: absolute;
            inset: 0;
            background: var(--bg-deep);
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: calc(18px + var(--safe-top)) 16px calc(96px + var(--safe-bottom));
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            transform: translateX(105%);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #generatorView.active {
            transform: translateX(0);
        }

        .qr-showcase-card {
            width: min(60vw, 235px);
            height: min(60vw, 235px);
            flex-shrink: 0;
            background: var(--card-glass);
            border: 2px solid rgba(108, 92, 231, 0.45);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.6);
            margin-top: 4px;
            transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #qrCanvas {
            width: 100% !important;
            height: 100% !important;
            background: #ffffff;
            border-radius: 12px;
            display: none;
        }

        #qrPlaceholder {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            padding: 10px;
            line-height: 1.6;
        }

        #statusText {
            margin-top: 10px;
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-muted);
            text-align: center;
            min-height: 26px;
        }

        /* شريط تقدم الرفع */
        .progress-bar-wrap {
            width: min(94%, 500px);
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 6px;
            display: none;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary-violet), var(--accent-cyan));
            transition: width 0.25s ease;
        }

        /* أزرار حفظ ومشاركة الرمز */
        .save-buttons-row {
            display: flex;
            gap: 10px;
            width: min(94%, 500px);
            margin-top: 8px;
            flex-shrink: 0;
        }

        .save-btn {
            flex: 1;
            height: 46px;
            border-radius: 999px;
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            color: var(--text-ice);
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
            transition: transform 0.12s ease, opacity 0.2s ease;
        }

        .save-png { background: var(--success-mint); }
        .save-jpg { background: var(--action-coral); }
        .share-qr { background: var(--card-glass); border-color: var(--accent-cyan); color: var(--accent-cyan); flex: 0.8; }

        /* حقل الإدخال */
        .input-wrapper {
            width: min(94%, 500px);
            margin-top: 14px;
            position: relative;
            flex-shrink: 0;
        }

        #qrInput {
            width: 100%;
            height: 60px;
            background: var(--input-bg);
            border: 2px solid rgba(0, 245, 212, 0.35);
            border-radius: 18px;
            padding: 0 16px 0 44px;
            color: var(--text-ice);
            font-size: 0.98rem;
            font-weight: 600;
            outline: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
            user-select: text;
            transition: border-color 0.2s ease;
        }

        #qrInput:focus {
            border-color: var(--accent-cyan);
        }

        #qrInput::placeholder {
            color: var(--text-muted);
        }

        #clearInputBtn {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }

        /* زر رفع الصور أو ملف PDF */
        #pickFilesBtn {
            width: min(94%, 500px);
            height: 56px;
            margin-top: 12px;
            flex-shrink: 0;
            background: var(--primary-violet);
            color: var(--text-ice);
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-radius: 18px;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
            transition: transform 0.12s ease, opacity 0.2s ease;
        }

        #pickFilesBtn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* ==================== زر التبديل السفلي العائم ==================== */
        #toggleModeBtn {
            position: fixed;
            bottom: calc(18px + var(--safe-bottom));
            width: min(86%, 420px);
            height: 56px;
            background: var(--primary-violet);
            color: var(--text-ice);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            font-size: 1.02rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65);
            z-index: 10;
            transition: transform 0.12s ease, background-color 0.25s ease;
        }

        button:active:not(:disabled) {
            transform: scale(0.94) !important;
        }

        .pop-anim {
            animation: popScale 0.28s ease-out;
        }

        @keyframes popScale {
            0% { transform: scale(0.86); }
            60% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- ==================== 1. واجهة المسح الضوئي ==================== -->
    <div id="scannerView">
        <video id="cameraVideo" playsinline webkit-playsinline muted autoplay></video>
        <div class="scanner-overlay"></div>

        <div class="top-hud">
            <div class="result-glass-card" id="resultCard">
                <span id="resultText">قم بتوجيه الكاميرا نحو رمز الـ QR للمسح التلقائي</span>
            </div>

            <div class="result-actions" id="resultActions">
                <button class="action-pill" id="openUrlBtn">فتح الرابط</button>
                <button class="action-pill" id="copyResultBtn">نسخ النتيجة</button>
                <button class="action-pill" id="rescanBtn">مسح جديد</button>
            </div>
        </div>

        <div class="focus-frame" id="focusFrame">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
            <div class="laser-bar" id="laserBar"></div>
        </div>

        <div class="scanner-controls">
            <div class="camera-tools-row">
                <button class="cam-tool-btn" id="switchCamBtn">تبديل الكاميرا</button>
                <button class="cam-tool-btn" id="torchBtn" style="display:none;">تشغيل الفلاش</button>
            </div>
            <button id="scanImageBtn">مسح QR من صورة في الجهاز</button>
        </div>
        <input type="file" id="scanFileInput" accept="image/*" style="display:none">
    </div>

    <!-- ==================== 2. واجهة توليد الـ QR ==================== -->
    <div id="generatorView">
        <div class="qr-showcase-card" id="qrCard">
            <canvas id="qrCanvas" width="1024" height="1024"></canvas>
            <div id="qrPlaceholder">سيظهر رمز الـ QR هنا فور الكتابة أو رفع الملفات</div>
        </div>

        <div id="statusText">بانتظار إدخال نص أو اختيار صور / PDF...</div>
        <div class="progress-bar-wrap" id="progressWrap">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>

        <div class="save-buttons-row">
            <button class="save-btn save-png" id="savePngBtn">حفظ PNG</button>
            <button class="save-btn save-jpg" id="saveJpgBtn">حفظ JPG</button>
            <button class="save-btn share-qr" id="shareQrBtn">مشاركة</button>
        </div>

        <div class="input-wrapper">
            <input type="text" id="qrInput" placeholder="اكتب نصاً، رابطاً، أو بريداً إلكترونياً..." autocomplete="off">
            <button id="clearInputBtn" title="مسح النص">✕</button>
        </div>

        <button id="pickFilesBtn">اختيار صور أو ملف PDF وتحويلها إلى QR</button>
        <input type="file" id="uploadFilesInput" accept="image/png,image/jpeg,image/webp,application/pdf" multiple style="display:none">
    </div>

    <!-- ==================== 3. زر التبديل السفلي ==================== -->
    <button id="toggleModeBtn">الانتقال إلى إنشاء QR</button>

    <script>
        // مفتاح الرفع الأساسي للصور
        const IMGBB_API_KEY = "d6e15cb5b6c12b8e7157afee611aa441";

        // عناصر الواجهة
        const scannerView = document.getElementById('scannerView');
        const generatorView = document.getElementById('generatorView');
        const cameraVideo = document.getElementById('cameraVideo');
        const resultCard = document.getElementById('resultCard');
        const resultText = document.getElementById('resultText');
        const resultActions = document.getElementById('resultActions');
        const openUrlBtn = document.getElementById('openUrlBtn');
        const copyResultBtn = document.getElementById('copyResultBtn');
        const rescanBtn = document.getElementById('rescanBtn');
        const switchCamBtn = document.getElementById('switchCamBtn');
        const torchBtn = document.getElementById('torchBtn');
        const corners = document.querySelectorAll('.corner');

        const scanImageBtn = document.getElementById('scanImageBtn');
        const scanFileInput = document.getElementById('scanFileInput');

        const qrCard = document.getElementById('qrCard');
        const qrCanvas = document.getElementById('qrCanvas');
        const qrPlaceholder = document.getElementById('qrPlaceholder');
        const statusText = document.getElementById('statusText');
        const progressWrap = document.getElementById('progressWrap');
        const progressFill = document.getElementById('progressFill');
        const qrInput = document.getElementById('qrInput');
        const clearInputBtn = document.getElementById('clearInputBtn');
        const savePngBtn = document.getElementById('savePngBtn');
        const saveJpgBtn = document.getElementById('saveJpgBtn');
        const shareQrBtn = document.getElementById('shareQrBtn');
        const pickFilesBtn = document.getElementById('pickFilesBtn');
        const uploadFilesInput = document.getElementById('uploadFilesInput');
        const toggleModeBtn = document.getElementById('toggleModeBtn');

        // متغيرات الحالة
        let isScanMode = true;
        let lastScannedData = "";
        let hasGeneratedQR = false;
        let debounceTimer = null;
        let videoStream = null;
        let currentFacingMode = "environment";
        let isTorchOn = false;
        let lastScanTime = 0;
        let scanAnimId = null;

        const hiddenScanCanvas = document.createElement('canvas');
        const hiddenScanCtx = hiddenScanCanvas.getContext('2d', { willReadFrequently: true });

        // ==================== تنبيه صوتي خفيف بدون ملفات خارجية ====================
        function playSuccessBeep() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.09);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            } catch (_) {}
        }

        // ==================== فحص البريد والروابط ====================
        function extractValidEmail(text) {
            if (!text) return null;
            let trimmed = text.trim();
            if (trimmed.toLowerCase().startsWith("mailto:")) {
                trimmed = trimmed.substring(7).split('?')[0].trim();
            }
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(trimmed) ? trimmed : null;
        }

        function isValidHttpUrl(string) {
            try {
                const url = new URL(string.trim());
                return url.protocol === "http:" || url.protocol === "https:";
            } catch (_) {
                return false;
            }
        }

        function triggerPop(el) {
            el.classList.remove('pop-anim');
            void el.offsetWidth;
            el.classList.add('pop-anim');
        }

        // ==================== إدارة الكاميرا المتوافقة مع كل الأجهزة ====================
        async function stopCamera() {
            if (scanAnimId) {
                cancelAnimationFrame(scanAnimId);
                scanAnimId = null;
            }
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            isTorchOn = false;
            torchBtn.classList.remove('active-tool');
            torchBtn.style.display = "none";
        }

        async function startCamera() {
            await stopCamera();
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                resultText.textContent = "المتصفح لا يدعم الكاميرا المباشرة، استخدم زر مسح صورة من الجهاز";
                return;
            }

            const constraintsList = [
                { video: { facingMode: { ideal: currentFacingMode }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
                { video: { facingMode: currentFacingMode }, audio: false },
                { video: true, audio: false }
            ];

            for (const constraints of constraintsList) {
                try {
                    videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                    break;
                } catch (_) {}
            }

            if (!videoStream) {
                resultText.textContent = "تعذر الوصول للكاميرا، يرجى السماح بالصلاحية أو مسح صورة من الجهاز";
                return;
            }

            cameraVideo.srcObject = videoStream;
            cameraVideo.setAttribute("playsinline", "true");

            try {
                await cameraVideo.play();
            } catch (_) {}

            // فحص دعم الفلاش (الكشاف) في الهواتف
            const track = videoStream.getVideoTracks()[0];
            if (track && typeof track.getCapabilities === "function") {
                const caps = track.getCapabilities();
                if (caps && caps.torch) {
                    torchBtn.style.display = "flex";
                }
            }

            scanAnimId = requestAnimationFrame(scanFrameLoop);
        }

        // تبديل الكاميرا الأمامية / الخلفية
        switchCamBtn.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
            startCamera();
        });

        // تشغيل / إيقاف الفلاش
        torchBtn.addEventListener('click', async () => {
            if (!videoStream) return;
            const track = videoStream.getVideoTracks()[0];
            if (!track) return;
            try {
                isTorchOn = !isTorchOn;
                await track.applyConstraints({ advanced: [{ torch: isTorchOn }] });
                torchBtn.classList.toggle('active-tool', isTorchOn);
                torchBtn.textContent = isTorchOn ? "إيقاف الفلاش" : "تشغيل الفلاش";
            } catch (_) {
                isTorchOn = false;
            }
        });

        // حلقة مسح محسنة الأداء (فحص كل 90 ملي ثانية لتوفير البطارية ومنع التقطيع)
        function scanFrameLoop(timestamp) {
            if (!isScanMode) return;

            if (timestamp - lastScanTime > 90 && cameraVideo.readyState >= cameraVideo.HAVE_ENOUGH_DATA) {
                lastScanTime = timestamp;

                const vw = cameraVideo.videoWidth;
                const vh = cameraVideo.videoHeight;
                if (vw > 0 && vh > 0) {
                    // تصغير أبعاد الفحص إلى 640 بكسل كحد أقصى لتسريع القراءة 4 أضعاف على الهواتف
                    const maxScanDim = 640;
                    const scale = Math.min(1, maxScanDim / Math.max(vw, vh));
                    const sw = Math.round(vw * scale);
                    const sh = Math.round(vh * scale);

                    hiddenScanCanvas.width = sw;
                    hiddenScanCanvas.height = sh;
                    hiddenScanCtx.drawImage(cameraVideo, 0, 0, sw, sh);

                    const imageData = hiddenScanCtx.getImageData(0, 0, sw, sh);
                    const code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: "attemptBoth"
                    });

                    if (code && code.data && code.data.trim() !== "") {
                        onQRCodeDetected(code.data);
                    }
                }
            }
            scanAnimId = requestAnimationFrame(scanFrameLoop);
        }

        function onQRCodeDetected(text) {
            if (text === lastScannedData) return;
            lastScannedData = text;

            if (navigator.vibrate) navigator.vibrate(90);
            playSuccessBeep();

            corners.forEach(c => c.style.borderColor = "#10B981");
            resultCard.style.borderColor = "#10B981";
            triggerPop(resultCard);
            setTimeout(() => {
                corners.forEach(c => c.style.borderColor = "#00F5D4");
                resultCard.style.borderColor = "rgba(0, 245, 212, 0.35)";
            }, 600);

            resultActions.style.display = "flex";
            const cleanMail = extractValidEmail(text);

            if (cleanMail) {
                resultText.textContent = cleanMail;
                resultText.style.color = "#00F5D4";
                openUrlBtn.textContent = "مراسلة البريد";
                openUrlBtn.style.background = "#FF3B7B";
                openUrlBtn.style.display = "inline-flex";
                triggerPop(openUrlBtn);
                return;
            }

            const isUrl = isValidHttpUrl(text);
            resultText.textContent = text;
            resultText.style.color = isUrl ? "#00F5D4" : "#F1F5F9";

            if (isUrl) {
                openUrlBtn.textContent = "فتح الرابط";
                openUrlBtn.style.background = "#6C5CE7";
                openUrlBtn.style.display = "inline-flex";
                triggerPop(openUrlBtn);
            } else {
                openUrlBtn.style.display = "none";
            }
        }

        // أزرار التفاعل مع النتيجة الممسوحة
        openUrlBtn.addEventListener('click', () => {
            const cleanMail = extractValidEmail(lastScannedData);
            if (cleanMail) {
                window.location.href = "mailto:" + cleanMail;
            } else if (isValidHttpUrl(lastScannedData)) {
                window.open(lastScannedData.trim(), '_blank', 'noopener,noreferrer');
            }
        });

        copyResultBtn.addEventListener('click', async () => {
            if (!lastScannedData) return;
            const textToCopy = extractValidEmail(lastScannedData) || lastScannedData;
            try {
                await navigator.clipboard.writeText(textToCopy);
                const oldText = copyResultBtn.textContent;
                copyResultBtn.textContent = "تم النسخ ✓";
                setTimeout(() => copyResultBtn.textContent = oldText, 1500);
            } catch (_) {
                // بديل للأجهزة القديمة
                const ta = document.createElement('textarea');
                ta.value = textToCopy;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                copyResultBtn.textContent = "تم النسخ ✓";
                setTimeout(() => copyResultBtn.textContent = "نسخ النتيجة", 1500);
            }
        });

        rescanBtn.addEventListener('click', () => {
            lastScannedData = "";
            resultText.textContent = "قم بتوجيه الكاميرا نحو رمز الـ QR للمسح التلقائي";
            resultText.style.color = "#F1F5F9";
            resultActions.style.display = "none";
            openUrlBtn.style.display = "none";
            triggerPop(resultCard);
        });

        // ==================== مسح QR متعدد المحاولات من صورة في الجهاز ====================
        scanImageBtn.addEventListener('click', () => scanFileInput.click());

        scanFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const img = new Image();
            img.onload = () => {
                // تجربة دقات متعددة مع إضافة هامش أبيض لضمان قراءة الرموز المقتطعة أو الكبيرة
                const targetScales = [1200, 800, 1600, 500];
                let detectedData = null;

                for (const maxDim of targetScales) {
                    let w = img.width;
                    let h = img.height;
                    if (w > maxDim || h > maxDim) {
                        const ratio = w / h;
                        if (w > h) { w = maxDim; h = Math.round(maxDim / ratio); }
                        else { h = maxDim; w = Math.round(maxDim * ratio); }
                    }

                    const pad = 24;
                    hiddenScanCanvas.width = w + pad * 2;
                    hiddenScanCanvas.height = h + pad * 2;
                    hiddenScanCtx.fillStyle = "#FFFFFF";
                    hiddenScanCtx.fillRect(0, 0, hiddenScanCanvas.width, hiddenScanCanvas.height);
                    hiddenScanCtx.drawImage(img, pad, pad, w, h);

                    const imgData = hiddenScanCtx.getImageData(0, 0, hiddenScanCanvas.width, hiddenScanCanvas.height);
                    const code = jsQR(imgData.data, imgData.width, imgData.height, {
                        inversionAttempts: "attemptBoth"
                    });

                    if (code && code.data) {
                        detectedData = code.data;
                        break;
                    }
                }

                if (detectedData) {
                    lastScannedData = "";
                    onQRCodeDetected(detectedData);
                } else {
                    resultText.style.color = "#FF3B7B";
                    resultText.textContent = "لم يتم العثور على رمز QR واضح داخل هذه الصورة";
                    resultActions.style.display = "none";
                    triggerPop(resultCard);
                }
                URL.revokeObjectURL(img.src);
            };
            img.src = URL.createObjectURL(file);
            scanFileInput.value = "";
        });

        // ==================== توليد رمز الـ QR الفوري ====================
        function updateGeneratorFromInput() {
            const raw = qrInput.value.trim();
            clearInputBtn.style.display = raw.length > 0 ? "flex" : "none";

            if (!raw) {
                qrCanvas.style.display = "none";
                qrPlaceholder.style.display = "block";
                hasGeneratedQR = false;
                statusText.style.color = "#94A3B8";
                statusText.textContent = "بانتظار إدخال نص أو اختيار صور / PDF...";
                return;
            }

            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                const cleanMail = extractValidEmail(raw);
                const payload = cleanMail ? ("mailto:" + cleanMail) : raw;

                renderQRToCanvas(payload);

                statusText.style.color = cleanMail ? "#FF3B7B" : "#00F5D4";
                statusText.textContent = cleanMail
                    ? "تم تجهيز رمز البريد المباشر!"
                    : "تم توليد رمز الـ QR بدقة عالية!";
            }, 180);
        }

        qrInput.addEventListener('input', updateGeneratorFromInput);

        clearInputBtn.addEventListener('click', () => {
            qrInput.value = "";
            updateGeneratorFromInput();
            qrInput.focus();
        });

        function renderQRToCanvas(textToEncode) {
            QRCode.toCanvas(qrCanvas, textToEncode, {
                width: 1024,
                margin: 2,
                errorCorrectionLevel: textToEncode.length > 180 ? 'L' : 'M',
                color: { dark: "#000000", light: "#FFFFFF" }
            }, (error) => {
                if (!error) {
                    qrPlaceholder.style.display = "none";
                    qrCanvas.style.display = "block";
                    hasGeneratedQR = true;
                    triggerPop(qrCard);
                } else {
                    statusText.style.color = "#FF3B7B";
                    statusText.textContent = "النص طويل جداً لتضمينه في رمز QR واحد";
                }
            });
        }

        // ==================== حفظ ومشاركة الـ QR على كل الأجهزة ====================
        function getCleanExportCanvas() {
            // ضمان خلفية بيضاء صلبة عند التصدير بصيغة JPG أو PNG
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = qrCanvas.width || 1024;
            exportCanvas.height = qrCanvas.height || 1024;
            const ctx = exportCanvas.getContext('2d');
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
            ctx.drawImage(qrCanvas, 0, 0, exportCanvas.width, exportCanvas.height);
            return exportCanvas;
        }

        function downloadQR(asPng) {
            if (!hasGeneratedQR) {
                statusText.style.color = "#FF3B7B";
                statusText.textContent = "لا يوجد رمز QR لحفظه حالياً!";
                return;
            }

            const ext = asPng ? "png" : "jpg";
            const mime = asPng ? "image/png" : "image/jpeg";
            const exportCanvas = getCleanExportCanvas();

            exportCanvas.toBlob((blob) => {
                if (!blob) return;
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const now = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 15);
                a.download = `QR_${now}.${ext}`;
                a.href = url;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 3000);

                statusText.style.color = "#10B981";
                statusText.textContent = `تم حفظ الرمز بصيغة ${ext.toUpperCase()} بنجاح!`;
            }, mime, 0.96);
        }

        savePngBtn.addEventListener('click', () => downloadQR(true));
        saveJpgBtn.addEventListener('click', () => downloadQR(false));

        shareQrBtn.addEventListener('click', () => {
            if (!hasGeneratedQR) {
                statusText.style.color = "#FF3B7B";
                statusText.textContent = "قم بإنشاء رمز QR أولاً للمشاركة!";
                return;
            }

            const exportCanvas = getCleanExportCanvas();
            exportCanvas.toBlob(async (blob) => {
                if (!blob) return;
                const file = new File([blob], "QR_Code.png", { type: "image/png" });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            title: "رمز QR",
                            text: qrInput.value.trim(),
                            files: [file]
                        });
                        return;
                    } catch (_) {}
                }
                // في حال عدم دعم المتصفح لمشاركة الملفات، يتم تنزيل الصورة مباشرة
                downloadQR(true);
            }, "image/png");
        });

        // ==================== دمج ورفع الصور أو PDF مع حماية ذاكرة الهواتف ====================
        pickFilesBtn.addEventListener('click', () => uploadFilesInput.click());

        function setUploadProgress(visible, percent = 0) {
            progressWrap.style.display = visible ? "block" : "none";
            progressFill.style.width = `${percent}%`;
            pickFilesBtn.disabled = visible;
        }

        uploadFilesInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            const pdfFiles = files.filter(f => f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf"));
            const imageFiles = files.filter(f => f.type.startsWith("image/"));

            let uploadedUrl = null;
            setUploadProgress(true, 20);

            try {
                if (pdfFiles.length > 0) {
                    statusText.style.color = "#00F5D4";
                    statusText.textContent = "جاري رفع ملف الـ PDF وتوليد الرمز...";
                    setUploadProgress(true, 50);
                    uploadedUrl = await uploadGeneralFile(pdfFiles[0]);
                } else if (imageFiles.length === 1) {
                    statusText.style.color = "#00F5D4";
                    statusText.textContent = "جاري تحسين ورفع الصورة...";
                    const singleBlob = await combineImagesVertically([imageFiles[0]], 1100);
                    setUploadProgress(true, 60);
                    uploadedUrl = await uploadImageBlob(singleBlob);
                } else if (imageFiles.length > 1) {
                    statusText.style.color = "#00F5D4";
                    statusText.textContent = `جاري دمج ${imageFiles.length} صور في صفحة واحدة...`;
                    const mergedBlob = await combineImagesVertically(imageFiles, 950);
                    setUploadProgress(true, 65);
                    statusText.textContent = "جاري رفع الصور المدمجة وتوليد الرمز...";
                    uploadedUrl = await uploadImageBlob(mergedBlob);
                }
            } catch (err) {
                console.error(err);
            }

            setUploadProgress(true, 100);
            setTimeout(() => setUploadProgress(false, 0), 350);

            if (uploadedUrl) {
                qrInput.value = uploadedUrl;
                clearInputBtn.style.display = "flex";
                renderQRToCanvas(uploadedUrl);
                statusText.style.color = "#10B981";
                statusText.textContent = "تم الرفع وتوليد رمز الـ QR بنجاح!";
            } else {
                statusText.style.color = "#FF3B7B";
                statusText.textContent = "تعذر رفع الملف، يرجى التحقق من اتصال الإنترنت والمحاولة مجدداً";
            }

            uploadFilesInput.value = "";
        });

        // دمج الصور عمودياً مع مراعاة الحد الأقصى لارتفاع Canvas في أجهزة iOS/Android (4096px)
        function combineImagesVertically(files, baseWidth = 950) {
            return new Promise((resolve, reject) => {
                const loadedImages = [];
                let count = 0;

                files.forEach((file, index) => {
                    const img = new Image();
                    img.onload = () => {
                        loadedImages[index] = img;
                        count++;
                        if (count === files.length) {
                            let targetWidth = baseWidth;
                            const spacing = loadedImages.length > 1 ? 14 : 0;

                            // حساب الارتفاع المبدئي
                            let rawTotalHeight = spacing * (loadedImages.length - 1);
                            loadedImages.forEach(im => {
                                rawTotalHeight += Math.max(1, Math.round(targetWidth * (im.height / im.width)));
                            });

                            // حماية متصفحات الهواتف (خاصة iOS Safari) من تجاوز الحد الأقصى لارتفاع Canvas
                            const MAX_SAFE_HEIGHT = 4000;
                            if (rawTotalHeight > MAX_SAFE_HEIGHT) {
                                const scaleDown = MAX_SAFE_HEIGHT / rawTotalHeight;
                                targetWidth = Math.max(360, Math.floor(targetWidth * scaleDown));
                            }

                            let totalHeight = 0;
                            const heights = loadedImages.map(im => {
                                const h = Math.max(1, Math.round(targetWidth * (im.height / im.width)));
                                totalHeight += h;
                                return h;
                            });
                            totalHeight += spacing * (loadedImages.length - 1);

                            const mergeCanvas = document.createElement('canvas');
                            mergeCanvas.width = targetWidth;
                            mergeCanvas.height = totalHeight;
                            const ctx = mergeCanvas.getContext('2d');

                            ctx.fillStyle = "#0E1422";
                            ctx.fillRect(0, 0, targetWidth, totalHeight);

                            let y = 0;
                            loadedImages.forEach((im, idx) => {
                                ctx.drawImage(im, 0, y, targetWidth, heights[idx]);
                                y += heights[idx] + spacing;
                                URL.revokeObjectURL(im.src);
                            });

                            mergeCanvas.toBlob(blob => {
                                if (blob) resolve(blob);
                                else reject(new Error("Canvas toBlob failed"));
                            }, 'image/jpeg', 0.84);
                        }
                    };
                    img.onerror = reject;
                    img.src = URL.createObjectURL(file);
                });
            });
        }

        // رفع الصور إلى ImgBB ثم التبديل التلقائي للخوادم البديلة
        async function uploadImageBlob(blob) {
            try {
                const formData = new FormData();
                formData.append("key", IMGBB_API_KEY);
                formData.append("image", blob, "merged.jpg");

                const res = await fetch("https://api.imgbb.com/1/upload", { method: "POST", body: formData });
                const json = await res.json();
                if (json && json.data && json.data.url) return json.data.url;
            } catch (_) {}

            return await uploadGeneralFile(new File([blob], "images.jpg", { type: "image/jpeg" }));
        }

        // رفع ملفات الـ PDF والملفات العامة عبر خوادم تدعم CORS في المتصفح مباشرة
        async function uploadGeneralFile(file) {
            // 1. المحاولة الأولى: Tmpfiles.org API
            try {
                const form1 = new FormData();
                form1.append("file", file);
                const res1 = await fetch("https://tmpfiles.org/api/v1/upload", { method: "POST", body: form1 });
                const json1 = await res1.json();
                if (json1 && json1.data && json1.data.url) {
                    return json1.data.url.replace("http://", "https://").replace("tmpfiles.org/", "tmpfiles.org/dl/");
                }
            } catch (_) {}

            // 2. المحاولة الثانية: Uguu.se API (يدعم CORS في جميع المتصفحات لملفات PDF والصور)
            try {
                const form2 = new FormData();
                form2.append("files[]", file);
                const res2 = await fetch("https://uguu.se/upload", { method: "POST", body: form2 });
                const json2 = await res2.json();
                if (json2 && json2.success && json2.files && json2.files[0] && json2.files[0].url) {
                    return json2.files[0].url;
                }
            } catch (_) {}

            return null;
        }

        // ==================== التبديل بين وضع الماسح ووضع التوليد ====================
        toggleModeBtn.addEventListener('click', () => {
            isScanMode = !isScanMode;
            if (isScanMode) {
                generatorView.classList.remove('active');
                toggleModeBtn.textContent = "الانتقال إلى إنشاء QR";
                toggleModeBtn.style.background = "#6C5CE7";
                startCamera();
            } else {
                generatorView.classList.add('active');
                toggleModeBtn.textContent = "العودة إلى الماسح الضوئي";
                toggleModeBtn.style.background = "#FF3B7B";
                stopCamera();
            }
        });

        // إيقاف الكاميرا مؤقتاً عند تصغير المتصفح لتوفير البطارية وإعادة تشغيلها عند العودة
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopCamera();
            } else if (isScanMode) {
                startCamera();
            }
        });

        // بدء تشغيل الكاميرا عند فتح الموقع
        window.addEventListener('DOMContentLoaded', startCamera);
    </script>
</body>
</html>
